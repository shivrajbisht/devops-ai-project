apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-backend
  namespace: default
  labels:
    app: website-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website-backend
  template:
    metadata:
      labels:
        app: website-backend
    spec:
      containers:
        - name: backend
          image: your-registry/website-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: website-config
                  key: APP_NAME
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"