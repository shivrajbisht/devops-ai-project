apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: default
  labels:
    app: website
stringData:
  POSTGRES_DB: website
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app
  DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/website
---
apiVersion: v1
kind: Secret
metadata:
  name: website-tls
  namespace: default
  labels:
    app: website
# Provide your TLS cert and key when using TLS on ingress
# type: kubernetes.io/tls
# data:
#   tls.crt: <base64>
#   tls.key: <base64>