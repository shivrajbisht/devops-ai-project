{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app-migrations.fullname" . }}-migrate
  labels:
    {{- include "app-migrations.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "app-migrations.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.migration.waitForDatabase.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.migration.waitForDatabase.image }}
          command: ["sh", "-c"]
          args:
            {{- if eq .Values.migration.waitForDatabase.type "postgres" }}
            - >
              until pg_isready -h "$DATABASE_HOST" -p "$DATABASE_PORT"; do
                echo "Waiting for Postgres...";
                sleep 2;
              done
            {{- else if eq .Values.migration.waitForDatabase.type "mysql" }}
            - >
              until mysqladmin ping -h "$DATABASE_HOST" -P "$DATABASE_PORT" --silent; do
                echo "Waiting for MySQL...";
                sleep 2;
              done
            {{- else }}
            - "echo 'Unknown DB type'; exit 1"
            {{- end }}
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.waitForDatabase.hostSecret.name }}
                  key: {{ .Values.migration.waitForDatabase.hostSecret.key }}
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.waitForDatabase.portSecret.name }}
                  key: {{ .Values.migration.waitForDatabase.portSecret.key }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "{{ .Values.migration.command }}"]
          env:
            {{- toYaml .Values.env | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}